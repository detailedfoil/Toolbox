<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toolbox">
<title>Price Tickets</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../style.css?v=20261010a">
<link rel="stylesheet" href="price-tickets/price-tickets.css?v=20261010a">
<link rel="preload" href="price-tickets/fonts/BarlowCondensed-ExtraBold.ttf" as="fetch" type="font/ttf" crossorigin>
<link rel="preload" href="price-tickets/fonts/BarlowSemiCondensed-Regular.ttf" as="fetch" type="font/ttf" crossorigin>
</head>
<body>
<div class="wrap pt">
  <a class="back" href="../index.html">&larr; Toolbox</a>
  <h1>Price Tickets</h1>
  <p class="pt-sub">Screwfix 90 x 75 mm shelf tickets. Add product codes and the live name and price fill in.</p>

  <form class="pt-add" id="addForm" autocomplete="off">
    <input id="codes" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go"
           placeholder="Product codes, e.g. 843PG 985GE" aria-label="Product codes">
    <button class="btn btn-primary" type="submit">Add</button>
  </form>
  <p class="pt-hint">Add one code or paste a whole list.</p>

  <div class="pt-toolbar" id="toolbar" hidden>
    <span class="pt-count" id="count"></span>
    <div class="pt-tools">
      <button class="btn btn-sm" id="checkAll" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Check prices
      </button>
      <button class="btn btn-sm btn-quiet" id="clearAll" type="button">Clear</button>
    </div>
  </div>

  <div id="list"></div>

  <div class="pt-empty" id="empty">
    <strong>No tickets yet</strong>
    Type a product code above. You can always edit the price and name before you print.
  </div>

  <div class="pt-end"></div>
  <div class="pt-bar" id="bar" hidden>
    <button class="btn btn-primary" id="dlSheet" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M12 3v18"/></svg>
      A4 sheet
    </button>
    <p class="pt-note" id="note">Print at 100% / Actual size, not Fit to page.</p>
  </div>
</div>
<div class="pt-toast" id="toast" role="status" aria-live="polite"></div>

<script src="price-tickets/font-data.js?v=20261010a"></script>
<script src="price-tickets/ticket-engine.js?v=20261010a"></script>
<script src="price-tickets/lookup.js?v=20261010a"></script>
<script src="price-tickets/app.js?v=20261010a"></script>
</body>
</html>
