<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toolbox">
<title>Shelf Check</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../style.css?v=20261011a">
<link rel="stylesheet" href="shelf-check/shelf-check.css?v=20261011b">
<script src="../auth-data.js?v=20261011b"></script>
<script src="../auth.js?v=20261011c"></script>
<script src="../analytics.js?v=20261011d"></script>
</head>
<body>
<div class="wrap sc">
  <a class="back" href="../index.html">&larr; Toolbox</a>
  <h1>Shelf Check</h1>
  <p class="sc-sub" id="sub">Front of house shelf prices, checked against screwfix.com every Monday morning.</p>

  <p class="sc-meta" id="meta">Loading the latest check</p>
  <p class="sc-error" id="error" role="alert" hidden></p>
  <div class="sc-alert" id="alert" role="status" hidden></div>

  <div id="main" hidden>
    <div class="sc-stats" id="stats"></div>

    <div class="sc-tabs" role="tablist" aria-label="Shelf check views">
      <button type="button" role="tab" id="tabbtn-changes" aria-controls="tab-changes" data-tab="changes" aria-selected="true" class="is-on">Changes<span id="nChanges"></span></button>
      <button type="button" role="tab" id="tabbtn-all" aria-controls="tab-all" data-tab="all" aria-selected="false">Full list<span id="nAll"></span></button>
    </div>

    <section id="tab-changes" role="tabpanel" aria-labelledby="tabbtn-changes">
      <p class="sc-hint" id="changesHint"></p>
      <ul class="sc-list" id="changesList"></ul>
      <div class="sc-empty" id="changesEmpty" hidden></div>
    </section>

    <section id="tab-all" role="tabpanel" aria-labelledby="tabbtn-all" hidden>
      <input class="sc-search" id="search" type="search" placeholder="Find a code or product" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Find a code or product">
      <p class="sc-hint" id="searchHint" hidden></p>
      <p class="sc-hint">Each bay runs top shelf first, left to right along each shelf, the way the planograms in the brief show it.</p>
      <div id="bays"></div>
    </section>

    <p class="sc-foot" id="foot"></p>
  </div>

  <div class="sc-end"></div>
  <div class="sc-bar" id="bar" hidden>
    <div class="sc-bar-btns">
      <button class="btn btn-primary" id="pdfChanges" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13l2 2 4-4"/></svg>
        Changes PDF
      </button>
      <button class="btn" id="pdfFull" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></svg>
        Full list PDF
      </button>
    </div>
    <p class="sc-bar-note">A4, black and white. Print at 100% / Actual size.</p>
  </div>
</div>
<div class="sc-toast" id="toast" role="status" aria-live="polite"></div>

<script src="shelf-check/sheet-engine.js?v=20261011b"></script>
<script src="shelf-check/app.js?v=20261011b"></script>
</body>
</html>
