<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toolbox">
<title>NPS</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../style.css?v=20261010c">
<link rel="stylesheet" href="nps/nps.css?v=20261010c">
</head>
<body>
<div class="wrap nps">
  <a class="back" href="../index.html">&larr; Toolbox</a>
  <h1>NPS</h1>
  <p class="nps-sub">See how many promoters it takes to hit your target, and how every store in the area is doing.</p>

  <section class="nps-file" id="load">
    <div class="nps-file-info" id="loadInfo">
      <strong>No workbook yet</strong>
      <span>Upload the dated NPS workbook (.xlsx) to start.</span>
    </div>
    <label class="btn btn-primary" for="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <span id="fileLabel">Upload workbook</span>
    </label>
    <input id="file" type="file" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  </section>
  <p class="nps-error" id="error" role="alert" hidden></p>

  <div id="main" hidden>
    <div class="nps-tabs" role="tablist" aria-label="NPS views">
      <button type="button" role="tab" id="tabbtn-calc" aria-controls="tab-calc" data-tab="calc" aria-selected="true" class="is-on">Calculator</button>
      <button type="button" role="tab" id="tabbtn-overview" aria-controls="tab-overview" data-tab="overview" aria-selected="false">Overview</button>
    </div>

    <section id="tab-calc" role="tabpanel" aria-labelledby="tabbtn-calc"></section>
    <section id="tab-overview" role="tabpanel" aria-labelledby="tabbtn-overview" hidden></section>
  </div>
</div>

<script src="nps/xlsx.mini.min.js?v=20261010b"></script>
<script src="nps/engine.js?v=20261010c"></script>
<script src="nps/app.js?v=20261010c"></script>
</body>
</html>
