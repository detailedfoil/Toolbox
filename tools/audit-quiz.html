<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Ready</title>
  <style>
    :root{--ink:#10263a;--muted:#5c6d7c;--paper:#f5f8fb;--card:#fff;--line:#dce5eb;--blue:#1769aa;--deep:#073b68;--teal:#00857b;--green:#168a62;--red:#bd3d4b;--amber:#d97c00;--shadow:0 16px 40px rgba(12,42,65,.11)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#eaf4f7 0,#f7f9fb 43%,#e9eff9 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button{font:inherit;cursor:pointer} .shell{width:min(960px,calc(100% - 32px));margin:0 auto;padding:34px 0 48px}.screen{display:none}.screen.active{display:block}
    .hero{background:var(--deep);border-radius:28px;color:#fff;padding:38px clamp(24px,5vw,58px);box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-75px;top:-90px;width:300px;height:300px;border:44px solid rgba(108,210,192,.22);border-radius:50%}.eyebrow{letter-spacing:.12em;text-transform:uppercase;font-size:.76rem;font-weight:750;color:#86d9cc;margin:0 0 10px}.hero h1{font-size:clamp(2.25rem,6vw,4.7rem);letter-spacing:-.065em;line-height:.92;margin:0;max-width:610px;position:relative;z-index:1}.hero h1 span{color:#89ddd0}.hero p{max-width:620px;margin:20px 0 0;font-size:1.06rem;line-height:1.58;color:#d9edf0;position:relative;z-index:1}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:23px;position:relative;z-index:1}.pill{border:1px solid rgba(255,255,255,.24);padding:7px 11px;border-radius:999px;color:#e8f8f7;font-size:.82rem}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:30px 2px 13px;gap:16px}.section-head h2{font-size:1.28rem;margin:0;letter-spacing:-.03em}.section-head p{margin:0;color:var(--muted);font-size:.92rem}.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.round{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;text-align:left;color:var(--ink);transition:.18s;min-height:122px}.round:hover{border-color:#a7c3d6;transform:translateY(-2px);box-shadow:0 9px 22px rgba(27,73,103,.09)}.round.selected{background:#e4f5f2;border:2px solid var(--teal);padding:17px}.round .icon{font-size:1.4rem}.round strong{display:block;font-size:1.02rem;margin:12px 0 5px}.round small{color:var(--muted);line-height:1.35}.round .check{float:right;opacity:0;color:var(--teal);font-weight:800}.round.selected .check{opacity:1}.start-row{margin:25px 0 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:13px;padding:14px 20px;font-weight:750;font-size:1rem}.primary{background:var(--blue);color:white;box-shadow:0 6px 15px rgba(23,105,170,.24)}.primary:hover{background:#09558d}.secondary{background:#e7eef3;color:#19435e}.secondary:hover{background:#dce6ed}.start-note{color:var(--muted);font-size:.9rem;margin:0}
    .topbar{display:flex;align-items:center;gap:13px;margin-bottom:15px}.back{background:transparent;border:0;color:var(--deep);font-weight:700;padding:8px 0}.progress{height:10px;background:#dce7ee;border-radius:999px;overflow:hidden;flex:1}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#55bda9);width:0%;transition:width .25s}.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}.quiz-card,.result-card{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:clamp(22px,5vw,46px);box-shadow:var(--shadow)}.tag{display:inline-block;background:#e6f1fb;color:#135e99;border-radius:999px;padding:6px 10px;font-weight:750;font-size:.78rem}.quiz-card h2{font-size:clamp(1.55rem,3.7vw,2.45rem);letter-spacing:-.045em;line-height:1.13;margin:18px 0 26px;max-width:770px}.hint{margin:-15px 0 17px;color:var(--muted);font-size:.91rem}.options{display:grid;gap:10px}.option{border:1.5px solid var(--line);background:#fff;border-radius:15px;padding:15px 16px;display:flex;align-items:flex-start;gap:12px;text-align:left;color:var(--ink);line-height:1.4;transition:.14s}.option:hover{border-color:#92b7cf;background:#f8fcff}.option.chosen{border-color:var(--blue);background:#eaf5ff}.option.correct{border-color:var(--green);background:#e8f7ef}.option.wrong{border-color:var(--red);background:#fff0f1}.letter{flex:none;background:#eaf0f4;color:#3f5a6f;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:.82rem}.chosen .letter{background:var(--blue);color:#fff}.correct .letter{background:var(--green);color:#fff}.wrong .letter{background:var(--red);color:#fff}.actions{display:flex;gap:12px;margin-top:25px;align-items:center;flex-wrap:wrap}.feedback{border-radius:13px;padding:14px 15px;margin-top:18px;line-height:1.45;display:none}.feedback.show{display:block}.feedback.good{background:#e6f7ed;color:#155e42}.feedback.bad{background:#fff0f1;color:#8b2934}.feedback b{display:block;margin-bottom:3px}
    .result-card{text-align:center;padding-block:46px}.score-ring{width:150px;height:150px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) var(--score),#e4edf0 0);position:relative}.score-ring:after{content:"";width:122px;height:122px;background:#fff;border-radius:50%;position:absolute}.score-ring span{z-index:1;font-size:2.5rem;font-weight:850;letter-spacing:-.08em}.result-card h2{font-size:2rem;letter-spacing:-.05em;margin:8px 0}.result-card p{color:var(--muted);margin:0 auto;max-width:530px;line-height:1.5}.misses{text-align:left;max-width:700px;margin:28px auto 0;display:grid;gap:10px}.miss{border:1px solid var(--line);border-radius:13px;padding:14px 15px}.miss strong{display:block;margin-bottom:4px}.miss span{font-size:.92rem;color:var(--muted)}.end-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
    @media (max-width:540px){.shell{width:min(100% - 22px,960px);padding-top:12px}.hero{border-radius:20px;padding:31px 23px}.quiz-card,.result-card{border-radius:19px;padding:24px 18px}.section-head{display:block}.section-head p{margin-top:6px}.start-row{align-items:stretch}.start-row .primary{width:100%}.topbar{flex-wrap:wrap}.progress{order:3;flex-basis:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="screen active" id="home">
      <header class="hero">
        <p class="eyebrow">Team training</p>
        <h1>Audit <span>ready.</span></h1>
        <p>Quick, practical questions for the moments that matter. Choose a round, practise until it feels automatic, then revisit anything you miss.</p>
        <div class="pills"><span class="pill" id="question-count"></span><span class="pill">Answers shuffle every time</span><span class="pill">No scores saved</span></div>
      </header>
      <div class="section-head"><h2>Choose your round</h2><p>Pick one or more. All rounds are selected to start.</p></div>
      <div class="rounds" id="rounds"></div>
      <div class="start-row"><button class="primary" id="start">Start quiz</button><button class="secondary" id="select-all">Select all</button><p class="start-note" id="start-note"></p></div>
    </section>

    <section class="screen" id="quiz">
      <div class="topbar"><button class="back" id="quit">← Change round</button><div class="progress"><i id="progress"></i></div><span class="counter" id="counter"></span></div>
      <article class="quiz-card"><span class="tag" id="tag"></span><h2 id="prompt"></h2><p class="hint" id="hint"></p><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="primary" id="check" disabled>Check answer</button><button class="primary" id="next" hidden>Next question</button></div></article>
    </section>

    <section class="screen" id="results">
      <article class="result-card"><div class="score-ring" id="score-ring"><span id="score"></span></div><h2 id="result-title"></h2><p id="result-copy"></p><div class="misses" id="misses"></div><div class="end-actions"><button class="primary" id="redo" hidden>Redo missed questions</button><button class="secondary" id="again">Choose another round</button></div></article>
    </section>
  </main>
  <script>
    const Q = (cat, ref, question, options, explain, multi=false) => ({cat, ref, question, options, explain, multi});
    const QUESTIONS = [
      Q('Critical response','External signage','It is very windy and an external wobble board is in use. What should you do?',[['Bring it inside or take it out of use until it is safe',true],['Leave it out unless it has already fallen over',false],['Ask a customer to keep an eye on it',false],['Only remove it if rain starts',false]],'Freestanding external signage must be brought in or removed from use in very windy conditions.'),
      Q('Critical response','Defibrillator','Someone comes into the store and asks for the defibrillator. What is your first action?',[['Hand it over immediately',true],['Find a duty manager before doing anything',false],['Ask why they need it before getting it',false],['Refuse because it is for store use only',false]],'Hand it over straight away. Do not delay helping someone by looking for a manager.'),
      Q('Critical response','Defibrillator','The defibrillator has been handed out. What must happen next?',[['Contact Store Helpdesk via Click to Chat',true],['Wait until the next weekly check',false],['Write it in the refusal log',false],['Order a new one from the till',false]],'After it has been handed out, contact Store Helpdesk via Click to Chat.'),

      Q('Challenge 25','Q73','A customer is buying an age-restricted product. How old must they appear before you ask for ID?',[['Under 18',false],['Under 21',false],['Under 25',true],['Under 30',false]],'If the customer looks under 25, ask for ID to verify that they are 18 or over.'),
      Q('Challenge 25','Q73','How can an age-restricted product be flagged to you? Select every correct answer.',[['Fusion pop-up',true],['Message on the A4 despatch note',true],['Web messaging',true],['Notifications on the RDT',true],['Flag on ILS',true],['A flashing shelf-edge light',false],['A klaxon at the till',false]],'Know all five flags: Fusion, the A4 despatch note, web messaging, RDT notifications and ILS.',true),
      Q('Challenge 25','Q73','You are under 18 and a Challenge 25 check is needed. What do you do?',[['Get someone aged 18 or over to perform the check and authorise or refuse the sale or handover',true],['Complete the check yourself if you feel confident',false],['Automatically refuse every sale',false],['Ask the customer to self-declare their age',false]],'A colleague under 18 must ask someone aged 18 or over to complete the C25 check.'),
      Q('Challenge 25','Q73','You are picking a Challenge 25 order to the holding area. Which three things must you do?',[['Highlight the statement on the A4 despatch note',true],['Put the order in a red bag',true],['Assign it to a C25 OC location',true],['Check the customer ID before picking',false],['Lock the order in the MAC cabinet',false]],'Highlight the despatch note, use a red bag and assign the order to a C25 OC location.',true),
      Q('Challenge 25','Q32','How should a picked Challenge 25 order awaiting collection be handled? Select every correct answer.',[['Use a red TCND bag with the age-restricted message clearly visible',true],['Keep it in the designated Challenge 25 holding area',true],['Use a yellow TCND bag',false],['Leave it in any ordinary OC location',false]],'Challenge 25 orders must be clearly marked in a red TCND bag and held in the designated C25 section.',true),
      Q('Challenge 25','Q74','Which forms of ID are acceptable in the UK to prove age? Select every correct answer.',[['Photo driving licence',true],['Passport',true],['PASS ID',true],['Bank card',false],['Birth certificate',false],['Student card',false]],'In the UK, acceptable proof is a photo driving licence, passport or PASS ID.',true),
      Q('Challenge 25','Q75','A customer cannot prove they are 18 or over, so the sale is refused. Which three things must you do?',[['Retain the C25 items',true],['Complete a refund if payment was taken',true],['Complete the refusal log',true],['Call head office',false],['Escort the customer out',false]],'Retain the items, refund if payment was taken and complete the refusal log.',true),

      Q('Deliveries','Q45–Q46','While marshalling a delivery, which of these are you not allowed to do?',[['Use your mobile phone',true],['Vape',true],['Smoke',true],['Wear hi-vis',false],['Watch the tail lift',false]],'No phones, vaping or smoking. The person managing the delivery must stay focused on the job.',true),
      Q('Deliveries','Q45–Q46','What must you wear when bringing a delivery in? Select every correct answer.',[['Safety footwear',true],['Hi-vis',true],['Helmet',false],['Any footwear if you are only helping briefly',false]],'Safety footwear and hi-vis are required while bringing the delivery in.',true),
      Q('Deliveries','Q45–Q46','Can someone enter the exclusion zone while the tail lift is raised or moving?',[['No — keep out unless the specific longs exception applies while the lift is raised and stationary',true],['Yes, if they are wearing hi-vis',false],['Yes, if they are only there for a few seconds',false],['Yes, if the driver says it is fine',false]],'Keep out while the tail lift is moving, unloading or raised. The limited longs exception only applies when the lift is raised and stationary.'),
      Q('Deliveries','Q45–Q46','What is the minimum required size of the exclusion zone around the tail lift?',[['At least 3 m behind the tail lift and 1 m clear on either side',true],['1 m behind the tail lift and 3 m clear on either side',false],['2 m all the way around the vehicle',false],['5 m behind the vehicle, with no side clearance needed',false]],'Keep at least 3 m clear behind the tail lift, with at least 1 m clear on either side.'),
      Q('Deliveries','Q45–Q46','What should you do if a driver breaches the delivery safety process?',[['Report it to Wincanton and record it as a near miss on EcoOnline',true],['Ignore it because the driver is not a colleague',false],['Only mention it at the next team meeting',false],['Stop all deliveries for the rest of the day',false]],'A driver breach must be reported to Wincanton and recorded as a near miss on EcoOnline.'),

      Q('WEEE & waste','WEEE','What do we take back under WEEE regulations?',[['Electrical items on a like-for-like, one-for-one basis, plus undamaged non-commercial batteries',true],['Any electrical item with no conditions',false],['Only items originally bought from us',false],['Nothing — it is a supplier-only scheme',false]],'Take electrical items back on a like-for-like, one-for-one basis. Undamaged non-commercial batteries are also accepted.'),
      Q('WEEE & waste','WEEE','A customer brings an old electrical item that they did not buy from us. Do we take it?',[['Yes, if they are purchasing a similar item from us today',true],['No, it must have been bought from us',false],['Only with any proof of purchase',false],['Only with duty manager approval',false]],'The customer can return it while buying a like-for-like item today; it does not need to have been bought from us.'),
      Q('WEEE & waste','WEEE','Where do undamaged returned batteries go?',[['In the battery recycling box, with no sticker required',true],['In the damages cage with a green sticker',false],['In general waste',false],['Back to the supplier by post',false]],'Undamaged non-commercial batteries go straight into the battery recycling box.'),
      Q('WEEE & waste','WEEE','A customer brings back a damaged or swollen battery. Do we take it?',[['No — damaged batteries are not accepted',true],['Yes, all batteries are accepted',false],['Yes, if it is double-bagged',false],['Only with duty manager approval',false]],'Do not accept damaged batteries. Only undamaged non-commercial batteries are accepted.'),
      Q('WEEE & waste','Waste streams','Which bin does food waste go in?',[['Yellow',true],['Black',false],['Green clear bag',false],['Red',false]],'Yellow is for food waste.'),
      Q('WEEE & waste','Waste streams','Which bin does confidential waste go in?',[['Black',true],['Yellow',false],['Red',false],['Green clear bag',false]],'Black is for confidential waste.'),
      Q('WEEE & waste','Waste streams','Which bin does recycling go in?',[['Green clear bag',true],['Black',false],['Yellow',false],['Red',false]],'A green clear bag is for recycling.'),
      Q('WEEE & waste','Waste streams','Which bin does general waste go in?',[['Red',true],['Yellow',false],['Black',false],['Green clear bag',false]],'Red is for general waste.'),
      Q('WEEE & waste','WEEE','A customer is buying a new electrical item today and wants to leave their old, like-for-like electrical item with us. What happens to the old item after we accept it?',[['Put a green WEEE sticker on it, then place it in the damages cage',true],['Put it in general waste',false],['Put it in the battery recycling box',false],['Put it on the clearance shelf',false]],'Once the like-for-like WEEE return has been accepted, put a green WEEE sticker on it and place it in the damages cage.'),

      Q('Collections','Collections','A customer is collecting an Internet debit or credit card order. What do you need to do?',[['Ask to see some ID',true],['Chip and PIN check the card',false],['See photo ID that matches the order',false],['Nothing extra',false]],'For Internet debit or credit-card orders, ask to see some ID.'),
      Q('Collections','Collections','A customer is collecting a Contact Centre debit or credit card order for £35. What do you need to do?',[['Ask to see some ID',true],['Chip and PIN check the card',false],['Ask for the physical card and manage it from that point',false],['Nothing extra',false]],'For Contact Centre card orders under £50, ask to see ID.'),
      Q('Collections','Collections','A customer is collecting a Contact Centre debit or credit card order for £120. What do you need to do?',[['Chip and PIN check the card',true],['Ask to see some ID',false],['See photo ID that matches the order',false],['Nothing extra',false]],'For Contact Centre card orders over £50, the card must be chip-and-PIN checked.'),
      Q('Collections','Collections','At what value do Contact Centre debit or credit card orders switch from ID to a chip-and-PIN check?',[['£50',true],['£30',false],['£100',false],['£250',false]],'£50 is the threshold: under £50, ask to see ID; over £50, chip-and-PIN check the card.'),
      Q('Collections','Collections','A customer is collecting a PayPal order for £150. What do you need to do?',[['See photo ID that matches the name on the order',true],['Ask to see any ID',false],['Chip and PIN check a card',false],['Ask for the physical card',false]],'PayPal orders over £100 require photo ID that matches the name on the order.'),
      Q('Collections','Collections','At what value do PayPal collections start needing photo ID?',[['Over £100',true],['Over £50',false],['Over £30',false],['Over £250',false]],'PayPal collections over £100 require photo ID.'),
      Q('Collections','Collections','A customer is collecting a TUK order. What do you need to do?',[['Ask for the physical card, then manage the collection from that point',true],['Ask to see any ID',false],['Chip and PIN check the card',false],['Nothing extra',false]],'For TUK orders, ask for the physical card and manage the collection from that point.'),

      Q('Tills & counter','Team knowledge','Before transacting on a customer account, how many pieces of information must you confirm?',[['Three',true],['One',false],['Two',false],['Four',false]],'Confirm three pieces of information. Scanning a Screwfix card or app counts as one of the three.'),
      Q('Tills & counter','Team knowledge','To switch a Check-in Device to a Browser device using the three dots, what code do you enter?',[['1022',true],['2210',false],['0122',false],['1202',false]],'The code is 1022.')
    ];

    const $ = id => document.getElementById(id);
    const state = {selected:new Set(), pool:[], index:0, score:0, misses:[], picks:new Set(), checked:false};
    const icon = {"Critical response":"⚡","Challenge 25":"🔞","Deliveries":"🚚","Safety basics":"🦺","WEEE & waste":"♻️","Collections":"📦","Tills & counter":"🧾"};
    const categories = [...new Set(QUESTIONS.map(q=>q.cat))];
    const shuffle = list => [...list].sort(()=>Math.random()-.5);
    const show = id => {document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); $(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'});};
    const resetSelection = () => {state.selected=new Set(categories); renderRounds();};
    function renderRounds(){
      $('rounds').innerHTML='';
      categories.forEach(cat=>{const count=QUESTIONS.filter(q=>q.cat===cat).length, selected=state.selected.has(cat); const b=document.createElement('button'); b.className='round'+(selected?' selected':''); b.innerHTML=`<span class="check">✓</span><span class="icon">${icon[cat]}</span><strong>${cat}</strong><small>${count} question${count===1?'':'s'}</small>`; b.onclick=()=>{selected?state.selected.delete(cat):state.selected.add(cat);renderRounds()};$('rounds').append(b)});
      const n=QUESTIONS.filter(q=>state.selected.has(q.cat)).length;$('start-note').textContent=n?`${n} question${n===1?'':'s'} selected`:'Choose at least one round to begin';$('start').disabled=!n;$('start').style.opacity=n?'1':'.5';
    }
    function start(pool){
      const prepared=shuffle(pool||QUESTIONS.filter(q=>state.selected.has(q.cat))).map(q=>({...q, options:shuffle(q.options)}));
      const WEEE_PROCESSING='A customer is buying a new electrical item today and wants to leave their old, like-for-like electrical item with us. What happens to the old item after we accept it?';
      const processingIndex=prepared.findIndex(q=>q.question===WEEE_PROCESSING);
      if(processingIndex!==-1){
        const [processing]=prepared.splice(processingIndex,1);
        const lastWEEE=prepared.reduce((last,q,index)=>q.cat==='WEEE & waste'?index:last,-1);
        prepared.splice(lastWEEE+1,0,processing);
      }
      state.pool=prepared;state.index=0;state.score=0;state.misses=[];show('quiz');renderQuestion();
    }
    function renderQuestion(){
      const q=state.pool[state.index];state.picks=new Set();state.checked=false;$('counter').textContent=`${state.index+1} / ${state.pool.length}`;$('progress').style.width=`${state.index/state.pool.length*100}%`;$('tag').textContent=`${q.cat} · ${q.ref}`;$('prompt').textContent=q.question;$('hint').textContent=q.multi?'Choose every answer you believe is correct, then check.':'Choose one answer, then check.';$('options').innerHTML='';$('feedback').className='feedback';$('check').hidden=false;$('next').hidden=true;$('check').disabled=true;
      q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${o[0]}</span>`;b.onclick=()=>pick(i);$('options').append(b)});
    }
    function pick(i){if(state.checked)return;const q=state.pool[state.index];if(q.multi){state.picks.has(i)?state.picks.delete(i):state.picks.add(i)}else{state.picks=new Set([i])};[...$('options').children].forEach((b,k)=>b.classList.toggle('chosen',state.picks.has(k)));$('check').disabled=!state.picks.size}
    function check(){
      const q=state.pool[state.index], correct=new Set(q.options.map((o,i)=>o[1]?i:null).filter(i=>i!==null)), right=correct.size===state.picks.size&&[...correct].every(i=>state.picks.has(i));state.checked=true;[...$('options').children].forEach((b,i)=>{b.disabled=true;if(correct.has(i))b.classList.add('correct');if(state.picks.has(i)&&!correct.has(i))b.classList.add('wrong')});if(right)state.score++;else state.misses.push(q);const f=$('feedback');f.className='feedback show '+(right?'good':'bad');f.innerHTML=`<b>${right?'Correct — nice work.':'Not quite.'}</b>${q.explain}`;$('check').hidden=true;$('next').hidden=false;$('next').textContent=state.index===state.pool.length-1?'See my result':'Next question';
    }
    function next(){state.index++;state.index<state.pool.length?renderQuestion():results()}
    function results(){
      const total=state.pool.length,pct=Math.round(state.score/total*100);$('progress').style.width='100%';$('score-ring').style.setProperty('--score',pct+'%');$('score').textContent=pct+'%';$('result-title').textContent=pct===100?'Clean sheet.':pct>=75?'You are in good shape.':'Worth another run.';$('result-copy').textContent=`You got ${state.score} of ${total} correct. ${state.misses.length?'Your missed questions are below, ready for a quick retry.':'Nothing to revisit this time.'}`;$('misses').innerHTML=state.misses.map(q=>`<div class="miss"><strong>${q.question}</strong><span>${q.explain}</span></div>`).join('');$('redo').hidden=!state.misses.length;show('results');
    }
    $('start').onclick=()=>start();$('select-all').onclick=resetSelection;$('quit').onclick=()=>show('home');$('check').onclick=check;$('next').onclick=next;$('again').onclick=()=>show('home');$('redo').onclick=()=>start(state.misses);$('question-count').textContent=`${QUESTIONS.length} quick questions`;resetSelection();
  </script>
</body>
</html>
