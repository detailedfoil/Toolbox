<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6bb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toolbox">
<title>Product Search</title>
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../style.css?v=b86f5823a5">
<link rel="stylesheet" href="product-search/product-search.css?v=61863f8fa3">
<script src="../analytics.js?v=f5e6d397aa"></script>
</head>
<body class="sx">
<div class="sx-account">
  <span class="sx-parody">Hopefully this won&#8217;t crash either.</span>
</div>
<header class="sx-head">
  <div class="sx-head-in">
    <div class="sx-brand">
      <span class="sx-logo" aria-label="CrashFix"><span class="sx-crash">CRASH</span><span class="sx-fix">FIX</span></span>
      <span class="sx-title">Product Search</span>
    </div>
  </div>
</header>
<div class="sx-find">
  <form class="sx-form" id="form" role="search" autocomplete="off">
    <input id="q" class="sx-input" type="search" inputmode="search" enterkeyhint="search" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="Getting the product list ready..." aria-label="Search by product code or name">
    <button class="sx-go" type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.8"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
  </form>
</div>
<div class="sx-strip" id="strip"><b>SEARCH</b> in as little as <span id="stripMs">1 millisecond</span></div>
<a class="sx-promo" href="#q" onclick="document.getElementById('q').focus();return false">ONLY SEARCHES NAILED ITEMS. SEARCH NOW <i aria-hidden="true"></i></a>

<main class="sx-main">
  <p class="sx-status" id="status" role="status">Loading the product list...</p>
  <p class="sx-note" id="note" hidden></p>

  <section class="sx-welcome" id="welcome">
    <h2 id="welcomeTitle">Search nailed items</h2>
  </section>

  <ol class="sx-results" id="results" aria-label="Results"></ol>
  <div class="sx-more" id="more" hidden></div>

  <section class="sx-settings" id="settings">
    <h2>Settings</h2>
    <label class="sx-switch">
      <input type="checkbox" id="nophotos">
      <span class="sx-knob" aria-hidden="true"></span>
      <span>Don't load photos (saves data)</span>
    </label>
  </section>
</main>

<div class="sx-toast" id="toast" role="status" hidden></div>

<script src="product-search/search.js?v=4cb4264a3c"></script>
<script src="product-search/photos.js?v=0197b7a96c"></script>
<script src="product-search/app.js?v=441368b03e"></script>
</body>
</html>
