# Hourly fuel price check for the Toolbox "Fuel Prices" page (Leighton Buzzard forecourts).
#
# Reads PetrolPrices.co.uk's public Leighton Buzzard page (the UK Government Fuel Finder feed) once an hour from
# about 6am to 10pm UK time and saves tools/fuel/data/prices.json when anything changes. One page read per run,
# done in seconds. The page also checks for itself whenever it's opened, so this is the backup and the history.
#
# To run it by hand: Actions tab > Fuel prices > Run workflow. To switch it off: delete the schedule: block.
name: Fuel prices

on:
  schedule:
    # GitHub reads these as UTC: 05:23 to 21:23 UTC is 06:23 to 22:23 in summer (BST), 05:23 to 21:23 in winter (GMT).
    - cron: '23 5-21 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/fuel/parse.js'
      - '.github/fuel/**'
      - '.github/workflows/fuel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the fuel prices
        run: node .github/fuel/check.mjs

      - name: Save the results
        run: |
          if [ ! -f tools/fuel/data/prices.json ]; then echo "Nothing to save"; exit 0; fi
          git add tools/fuel/data/prices.json
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/fuel-commit.txt"
          for i in 1 2 3; do git push -q && exit 0; sleep 5; git pull -q --rebase; done
          exit 1
