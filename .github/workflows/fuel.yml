# Fuel price backup for the Toolbox "Fuel Prices" page: Leighton Buzzard only (detailedfoil, 19 Oct 2026).
#
# SWITCHED OFF on 21 Oct 2026: the page checks prices live every time it's opened and that's fast enough, so
# there is no automatic schedule any more. The saved copy in tools/fuel/data/prices.json is only a fallback now.
#
# To run it by hand: Actions tab > Fuel prices > Run workflow (reads petrol and diesel through jina, saves if changed).
# To switch the schedule back on, add this under "on:":
#   schedule:
#     - cron: '23 5-20/3 * * *'    # every 3 hours, 06:23 to 21:23 UK summer time
name: Fuel prices

on:
  push:
    branches: [main]
    paths:
      - 'tools/fuel/parse.js'
      - '.github/fuel/**'
      - '.github/workflows/fuel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the fuel prices
        run: node .github/fuel/check.mjs

      - name: Save the results
        run: |
          if [ ! -f tools/fuel/data/prices.json ]; then echo "Nothing to save"; exit 0; fi
          git add tools/fuel/data/prices.json
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/fuel-commit.txt"
          for i in 1 2 3; do git push -q && exit 0; sleep 5; git pull -q --rebase; done
          exit 1
