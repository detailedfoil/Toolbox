# Fuel price backup for the Toolbox "Fuel Prices" page: Leighton Buzzard only (detailedfoil, 19 Oct 2026).
#
# Every store's page checks its prices live when it's opened. For Leighton Buzzard this also reads them every
# 3 hours from about 6am to 9pm UK time and saves tools/fuel/data/prices.json when anything changes, as a fallback
# and a history of what moved. Two page reads through jina per run (petrol and diesel), done in seconds.
#
# To run it by hand: Actions tab > Fuel prices > Run workflow. To switch it off: delete the schedule: block.
name: Fuel prices

on:
  schedule:
    # GitHub reads these as UTC: 05:23, 08:23 ... 20:23 UTC is 06:23 to 21:23 in summer (BST), an hour earlier in winter.
    - cron: '23 5-20/3 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/fuel/parse.js'
      - '.github/fuel/**'
      - '.github/workflows/fuel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the fuel prices
        run: node .github/fuel/check.mjs

      - name: Save the results
        run: |
          if [ ! -f tools/fuel/data/prices.json ]; then echo "Nothing to save"; exit 0; fi
          git add tools/fuel/data/prices.json
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/fuel-commit.txt"
          for i in 1 2 3; do git push -q && exit 0; sleep 5; git pull -q --rebase; done
          exit 1
