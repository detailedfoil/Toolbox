name: Counter trial diagnosis
on:
  push:
    branches: [diag-ct3]
    paths: ['.github/workflows/diag-ct.yml', '.github/counter-trial/diag.mjs']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: .github/counter-trial
      - run: node .github/counter-trial/diag.mjs
      - name: Save
        if: always()
        run: |
          git add -f diag/ || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "diag output [skip ci]" && git push -q
