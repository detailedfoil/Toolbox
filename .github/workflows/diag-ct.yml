name: Counter trial diagnosis
on:
  push:
    branches: [diag-ct3]
    paths: ['.github/workflows/diag-ct.yml', '.github/counter-trial/diag.mjs', '.github/e2e/**']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: .github/e2e
      - name: Live page in real Chrome
        run: node .github/e2e/e2e.mjs
        working-directory: .
        env:
          NODE_PATH: .github/e2e/node_modules
      - name: Save
        if: always()
        run: |
          git add -f diag/ || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "diag output [skip ci]" && git push -q
