# Overnight Product Search check: for a few hundred products a night it reads the product page on screwfix.com
# (through jina, like the price checks) and saves the website name to tools/product-search/data/web-names.json, so
# Product Search can find products by either name, then fetches the 120 x 120 photo from Screwfix's image server
# and saves it as tools/product-search/photos/<CODE>.jpg, so every phone gets photos from the Toolbox itself.
# Photos go through the free image relay wsrv.nl, because Screwfix's image server turned GitHub away when asked
# directly (20 Oct 2026). To leave photos out again, add PHOTOS: 'off' to the env below.
# Around the clock, one product about every 20 s with breaks: about 3 days for the whole list; what's already found
# isn't fetched again. 4 failures in a row: an hour's pause. 3 pauses with nothing working: it gives up, the run shows
# as failed (GitHub emails you), and the next run tries a few first. Details at the top of check.mjs.
#
# A push that changes the check itself runs a small batch of 20, so a mistake shows up straight away.
# To run it by hand: Actions tab > Product Search names and photos > Run workflow (choose how many).
name: Product Search names and photos

on:
  schedule:
    # Every 6 hours, each run up to 5.5 hours, so it goes round the clock until everything is done; after that the runs
    # find nothing to do and finish in a minute. Only one runs at a time (a new one waits for the last to finish).
    - cron: '23 0,6,12,18 * * *'
  push:
    branches: [main]
    paths:
      - '.github/product-search/check.mjs'
      - '.github/workflows/product-search-names.yml'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many products to try (0 = no limit, as the scheduled runs do)'
        type: number
        default: 20

permissions:
  contents: write

concurrency:
  group: product-search-names
  cancel-in-progress: false

jobs:
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the page reader
        working-directory: .github
        run: npm ci --no-audit --no-fund

      - name: Read product names and photos on screwfix.com
        timeout-minutes: 345
        env:
          LIMIT: ${{ github.event_name == 'push' && '20' || inputs.count || '' }}
          GAP_MS: '20000'       # about one product every 20 s, never evenly (14 to 26 s); see the top of check.mjs
          RUN_MINUTES: '330'
        run: node .github/product-search/check.mjs

      - name: Save the names and photos
        if: always()
        run: |
          [ -f tools/product-search/data/web-names.json ] || exit 0
          git add tools/product-search/data/web-names.json tools/product-search/photos
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ -f "$RUNNER_TEMP/names-commit.txt" ]; then git commit -q -F "$RUNNER_TEMP/names-commit.txt"; else git commit -q -m "Product names and photos (run stopped early) [skip ci]"; fi
          for i in 1 2 3; do git push -q && exit 0; sleep 5; git pull -q --rebase; done
          exit 1
