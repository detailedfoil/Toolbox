# Real road drive times for Stock Stealer. Runs by hand (Actions tab > Stock Stealer drive times > Run workflow)
# or when the script or store list changes, and saves tools/stock-swaps/data/drive.json.
name: Stock Stealer drive times

on:
  push:
    branches: [main]
    paths:
      - '.github/stock-swaps/drive-times.mjs'
      - '.github/workflows/stock-drive-times.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  times:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/stock-swaps/drive-times.mjs
      - name: Save the times
        run: |
          git add tools/stock-swaps/data/drive.json
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Stock Stealer: road drive times [skip ci]"
          for i in 1 2 3; do git push -q && exit 0; sleep 5; git pull -q --rebase; done
          exit 1
