name: diag-avg
on:
  push:
    branches: [diag-avg]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch
        run: |
          curl -sS -m 60 -H 'Accept: text/plain' -H 'X-Timeout: 20' -H 'X-Cache-Tolerance: 300' 'https://r.jina.ai/https://www.petrolprices.co.uk/fuel-price-index.php' | tr -d '\r' > out.txt || true
          wc -c out.txt
          n=$(grep -n -i 'UK Average Fuel Prices' out.txt | head -1 | cut -d: -f1); echo "start line $n"
          s=$(( ${n:-1} - 3 )); [ $s -lt 1 ] && s=1
          body=$(sed -n "${s},$((s+60))p" out.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=avg-block::${body}"
          up=$(grep -n -i 'Updated\|Weekly UK\|Not live' out.txt | head -12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=avg-updated::${up}"
