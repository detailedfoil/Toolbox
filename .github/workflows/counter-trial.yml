# Daily Screwfix price check for the Toolbox "A25 Behind counter trial" page.
#
# When started by hand (nightly runs are off for now): checks each code on the trial's ticket list against screwfix.com, one at a time and
# very slowly (about one every 100 seconds, so roughly 2 hours), and saves the results to
# tools/counter-trial/data/prices.json. The later runs only finish off lines the first run couldn't
# check, and do nothing once the day is done.
# Changing the ticket list (tools/counter-trial/data/plan.json) checks any new codes.
#
# To run it by hand: Actions tab > Counter trial price check > Run workflow.
#   auto  the normal daily run (does nothing if today is already done)
#   full  check every line now
#   test  check every line but save nothing
name: Counter trial price check

on:
  # Automatic runs are switched off for now (detailedfoil, 14 Oct 2026): Screwfix kept blocking GitHub
  # part way through. It only runs when started by hand: the page's Check on GitHub button, or
  # Actions > Counter trial price check > Run workflow. To switch the nightly run back on, restore:
  #   schedule:
  #     - cron: '7 2 * * *'
  #     - cron: '37 5 * * *'
  #     - cron: '37 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = the normal daily run, full = check every line now, test = check every line but save nothing'
        type: choice
        default: auto
        options: [auto, full, test]

permissions:
  contents: write

concurrency:
  group: counter-trial
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the page reader
        working-directory: .github/counter-trial
        run: npm ci --no-audit --no-fund

      - name: Check prices on screwfix.com
        timeout-minutes: 180
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          GAP_MS: '100000'      # one product every 100 s or so: about 2 hours for all 69
        run: node .github/counter-trial/check.mjs

      - name: Save the results
        if: always()
        run: |
          git add tools/counter-trial/data/prices.json
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ -f "$RUNNER_TEMP/counter-commit.txt" ]; then git commit -q -F "$RUNNER_TEMP/counter-commit.txt"; else git commit -q -m "Counter trial results (run stopped early)"; fi
          for i in 1 2 3; do git push -q && exit 0; sleep 5; git pull -q --rebase; done
          exit 1
